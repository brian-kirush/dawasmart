<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f8f6">
    <title>Assistant | DawaSmart</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link href="./assets/css/app.css" rel="stylesheet">
  </head>
  <body data-active-page="assistant">
    <div id="app">
      <div class="dashboard-content">
        <div class="page-heading">
          <div>
            <p class="eyebrow">Decision support</p>
            <h1>DawaSmart Assistant</h1>
            <p class="text-secondary mb-0">
              Ask about stock, expiry risk, sales, forecasts, and reorder suggestions.
            </p>
          </div>
          <span class="status-chip status-chip-neutral">Your pharmacy only</span>
        </div>

        <div
          class="alert alert-danger"
          id="assistant-status"
          role="status"
          aria-live="polite"
          hidden
        ></div>

        <section class="content-card assistant-card" aria-label="DawaSmart chatbot">
          <div class="assistant-suggestions" id="assistant-suggestions">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-question="Which medicines are low in stock?">
              Low stock
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-question="Which batches expire soon?">
              Expiring batches
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-question="What are the latest reorder recommendations?">
              Reorders
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-question="Summarize recent sales.">
              Recent sales
            </button>
          </div>

          <div class="assistant-messages" id="assistant-messages" aria-live="polite">
            <article class="assistant-message assistant-message-bot">
              <p>
                Hello. I can summarize recorded inventory and forecasting data for
                this pharmacy. I cannot place orders or provide clinical advice.
              </p>
            </article>
          </div>

          <form class="assistant-form" id="assistant-form">
            <label class="visually-hidden" for="assistant-question">Message</label>
            <textarea
              class="form-control"
              id="assistant-question"
              rows="2"
              maxlength="1000"
              placeholder="Ask a question about this pharmacy..."
              required
            ></textarea>
            <button class="btn btn-primary" id="assistant-send" type="submit">
              Send
            </button>
          </form>
        </section>
      </div>
    </div>
    <script type="module" src="./assets/js/layout.js"></script>
    <script type="module" src="./assets/js/assistant.js"></script>
  </body>
</html>
