<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f8f6">
    <title>Add medicine | DawaSmart</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link href="./assets/css/app.css" rel="stylesheet">
  </head>
  <body data-active-page="medicines">
    <div id="app">
      <div class="dashboard-content">
        <div class="page-heading">
          <div>
            <p class="eyebrow">Inventory / Medicines</p>
            <h1>Add medicine</h1>
            <p class="text-secondary mb-0">
              Enter the catalogue details used to identify and forecast demand.
            </p>
          </div>
          <a class="btn btn-outline-secondary" href="./medicines.html">
            Cancel
          </a>
        </div>

        <div
          id="medicine-form-status"
          class="alert alert-info"
          role="status"
          aria-live="polite"
          hidden
        ></div>

        <section class="content-card medicine-form-card">
          <form id="medicine-form">
            <div class="form-section-heading">
              <h2>Medicine details</h2>
              <p>Use the name and unit shown on your pharmacy’s stock records.</p>
            </div>
            <div class="medicine-form-grid">
              <div>
                <label class="form-label" for="sku">SKU</label>
                <input
                  class="form-control"
                  id="sku"
                  name="sku"
                  type="text"
                  maxlength="80"
                  autocomplete="off"
                  required
                >
              </div>
              <div>
                <label class="form-label" for="generic-name">Generic name</label>
                <input
                  class="form-control"
                  id="generic-name"
                  name="generic_name"
                  type="text"
                  maxlength="160"
                  autocomplete="off"
                  required
                >
              </div>
              <div>
                <label class="form-label" for="brand-name">Brand name</label>
                <input
                  class="form-control"
                  id="brand-name"
                  name="brand_name"
                  type="text"
                  maxlength="160"
                  autocomplete="off"
                >
              </div>
              <div>
                <label class="form-label" for="strength">Strength</label>
                <input
                  class="form-control"
                  id="strength"
                  name="strength"
                  type="text"
                  maxlength="80"
                  placeholder="For example, 500 mg"
                >
              </div>
              <div>
                <label class="form-label" for="dosage-form">Dosage form</label>
                <input
                  class="form-control"
                  id="dosage-form"
                  name="dosage_form"
                  type="text"
                  maxlength="80"
                  placeholder="For example, tablet"
                >
              </div>
              <div>
                <label class="form-label" for="dispensing-unit">Dispensing unit</label>
                <input
                  class="form-control"
                  id="dispensing-unit"
                  name="dispensing_unit"
                  type="text"
                  maxlength="40"
                  placeholder="For example, tablet or sachet"
                  required
                >
              </div>
              <div>
                <label class="form-label" for="therapeutic-class">
                  Therapeutic class
                </label>
                <input
                  class="form-control"
                  id="therapeutic-class"
                  name="therapeutic_class"
                  type="text"
                  maxlength="120"
                >
              </div>
              <div>
                <label class="form-label" for="demand-pattern">Demand pattern</label>
                <select
                  class="form-select"
                  id="demand-pattern"
                  name="demand_pattern"
                  required
                >
                  <option value="unknown" selected>Not classified</option>
                  <option value="chronic">Chronic</option>
                  <option value="acute">Acute</option>
                </select>
                <div class="form-text">
                  This is a forecasting category, not clinical advice.
                </div>
              </div>
            </div>

            <div class="form-actions">
              <a class="btn btn-outline-secondary" href="./medicines.html">Cancel</a>
              <button
                class="btn btn-primary"
                id="save-medicine"
                type="submit"
                disabled
              >Save medicine</button>
            </div>
          </form>
        </section>
      </div>
    </div>
    <script type="module" src="./assets/js/layout.js"></script>
    <script type="module" src="./assets/js/medicine-form.js"></script>
  </body>
</html>
