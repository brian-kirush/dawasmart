services:
  - type: web
    name: dawasmart-api
    runtime: python
    plan: free
    buildCommand: pip install -r forecasting/requirements.txt
    startCommand: uvicorn forecasting.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FORECAST_API_TOKEN
        generateValue: true
      - key: FORECAST_PHARMACY_ID
        value: 11111111-1111-4111-8111-111111111111

  - type: web
    name: dawasmart
    runtime: static
    plan: free
    staticPublishPath: web
