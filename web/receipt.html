<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f8f6">
    <title>Receipt | DawaSmart</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link href="./assets/css/app.css" rel="stylesheet">
  </head>
  <body data-active-page="sales">
    <div id="app">
      <div class="dashboard-content">
        <div class="page-heading no-print">
          <div>
            <p class="eyebrow">Sales / Receipt</p>
            <h1>Sale receipt</h1>
            <p class="text-secondary mb-0">Saved transaction details.</p>
          </div>
          <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" href="./sales.html">Back to sales</a>
            <button class="btn btn-primary" id="print-receipt" type="button" disabled>
              Print receipt
            </button>
          </div>
        </div>
        <div
          id="receipt-status"
          class="alert alert-info no-print"
          role="status"
          aria-live="polite"
        >Loading receipt…</div>
        <section class="content-card receipt-card" id="receipt" hidden>
          <div class="text-center border-bottom pb-3 mb-3">
            <p class="eyebrow mb-1">DawaSmart</p>
            <h1 class="h3 mb-2" id="receipt-pharmacy"></h1>
            <p class="mb-0 text-secondary">Sale receipt</p>
          </div>
          <dl class="row small">
            <dt class="col-5">Receipt number</dt>
            <dd class="col-7" id="receipt-number"></dd>
            <dt class="col-5">Date and time</dt>
            <dd class="col-7" id="receipt-date"></dd>
            <dt class="col-5">Recorded by</dt>
            <dd class="col-7" id="receipt-staff"></dd>
          </dl>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th scope="col">Item</th>
                  <th scope="col">Qty</th>
                  <th scope="col">Unit price</th>
                  <th scope="col" class="text-end">Amount</th>
                </tr>
              </thead>
              <tbody id="receipt-items"></tbody>
              <tfoot>
                <tr>
                  <th colspan="3" scope="row">Total (KES)</th>
                  <th class="text-end" id="receipt-total"></th>
                </tr>
              </tfoot>
            </table>
          </div>
          <p class="decision-note mb-0">
            This receipt records the sale entered in DawaSmart. It does not record
            payment method or tax details.
          </p>
        </section>
      </div>
    </div>
    <script type="module" src="./assets/js/layout.js"></script>
    <script type="module" src="./assets/js/receipt.js"></script>
  </body>
</html>
